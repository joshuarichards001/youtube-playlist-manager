name: Refresh recommended feed

on:
  schedule:
    # 11:20 Europe/London in summer (BST), 10:20 in winter. Scheduled ~40 min
    # before the site reopens at 12:00 because GitHub cron triggers are often
    # 5-20+ minutes late and the run + Pages deploy needs a few more minutes.
    - cron: "20 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      # On failure (e.g. expired YOUTUBE_COOKIE) the script exits without
      # writing, so the previous recommended-feed JSON stays in place.
      - name: Fetch recommended feed
        run: node scripts/fetch-recommended.mjs
        env:
          YOUTUBE_COOKIE: ${{ secrets.YOUTUBE_COOKIE }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}

      - name: Commit updated feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain public/recommended-feed.json)" ]]; then
            git add public/recommended-feed.json
            git commit -m "chore: refresh recommended feed"
            git push
          else
            echo "No changes to commit."
          fi
